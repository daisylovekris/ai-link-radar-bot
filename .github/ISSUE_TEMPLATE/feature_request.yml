name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >
        Have an idea for a new feature or improvement? Tell us about it.
        **⚠️ Please do not include real bot tokens, private URLs, cookies, credentials, or unredacted logs.**

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think this should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have tried.
    validations:
      required: false

  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: Who will benefit and how?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Is this a small tweak, a new command, or a larger change?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, mockups, or references.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Confirm that the request contains no sensitive information.
      options:
        - label: I have removed tokens, private URLs, credentials, and other sensitive information.
          required: true
